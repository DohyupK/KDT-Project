# Copy to /etc/nginx/sites-available/kdt on the Lightsail host.
# sudo ln -sf /etc/nginx/sites-available/kdt /etc/nginx/sites-enabled/kdt
# sudo rm -f /etc/nginx/sites-enabled/default
# sudo nginx -t && sudo systemctl reload nginx
#
# Public inbound: 80 (and later 443). Do not expose 3000/3001/3306/5678/6333/8001/8800.
# Do not set Connection "upgrade" on every request — that breaks Next HMR handshake.

server {
    listen 80;
    server_name _;

    # next dev Turbopack HMR only. next start does not use this path.
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
