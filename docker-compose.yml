# n8n + Qdrant only. App code is NOT in Docker.
# Bind 127.0.0.1 so 5678/6333 are not on the public internet.
# Lightsail: docker compose up -d
# 이미 같은 이름의 컨테이너가 있으면 compose 전에 docker ps 로 확인.

services:
  qdrant:
    image: qdrant/qdrant
    container_name: kdt-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./DB/data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: kdt-n8n
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./DB/data/n8n:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678/
    restart: unless-stopped
